{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
  body {
    background: #f5f7fb;
  }

  .contact-card {
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }

  .contact-info {
    background: linear-gradient(135deg, #0d6efd, #0b5ed7);
    color: #fff;
    border-radius: 15px 0 0 15px;
  }

  .contact-info h3 {
    font-weight: 600;
  }

  .form-control {
    border-radius: 10px;
  }

  .btn-custom {
    border-radius: 10px;
    padding: 10px;
    font-weight: 500;
  }
</style>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card contact-card border-0">
        <div class="row g-0">

          <!-- Contact Info -->
          <div class="col-md-5 contact-info p-4 d-flex flex-column justify-content-center">
            <h3>Get in Touch</h3>
            <p class="mt-3">
              Have any questions? We're here to help.
            </p>
            <p class="mt-4 mb-1"><strong>Email:</strong> support@example.com</p>
            <p class="mb-1"><strong>Phone:</strong> +977-98XXXXXXXX</p>
            <p><strong>Location:</strong> Kathmandu, Nepal</p>
          </div>

          
           

          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
